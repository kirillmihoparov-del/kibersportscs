<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - CS2 Arena</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            background: rgba(31, 41, 55, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(234, 88, 12, 0.3);
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: #ea580c;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .auth-title { color: white; font-size: 1.75rem; margin-bottom: 0.5rem; }
        .auth-subtitle { color: #9ca3af; font-size: 0.875rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label {
            display: block;
            color: #d1d5db;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(55, 65, 81, 0.5);
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
        }
        .form-input:focus { outline: none; border-color: #ea580c; }
        .auth-button {
            width: 100%;
            padding: 0.75rem;
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .auth-button:hover { background: #c2410c; }
        .auth-footer { text-align: center; color: #6b7280; font-size: 0.875rem; }
        .auth-link { color: #ea580c; text-decoration: none; }
        .error-message {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #dc2626;
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }
        .back-home { text-align: center; margin-top: 1.5rem; }
        .back-home a { color: #9ca3af; text-decoration: none; font-size: 0.875rem; }
        .back-home a:hover { color: #ea580c; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    CS2 ARENA
                </div>
                <h1 class="auth-title">Вход в аккаунт</h1>
                <p class="auth-subtitle">Введите свои данные для входа</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Имя пользователя или Email</label>
                    <input type="text" id="loginInput" class="form-input" placeholder="Введите ваш username или email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="passwordInput" class="form-input" placeholder="Введите ваш пароль" required>
                </div>
                <button type="submit" class="auth-button">Войти</button>
                <div class="auth-footer">
                    Нет аккаунта? <a href="register.html" class="auth-link">Зарегистрироваться</a>
                </div>
            </form>
            <div class="back-home">
                <a href="index.html">← Вернуться на главную</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const loginValue = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('errorMessage');
            
            const users = JSON.parse(localStorage.getItem('cs2_users') || '[]');
            const user = users.find(u => (u.username === loginValue || u.email === loginValue) && u.password === password);
            
            if (user) {
                const currentUser = {
                    id: user.id,
                    username: user.username,
                    email: user.email,
                    firstName: user.firstName,
                    lastName: user.lastName,
                    avatar: user.username.charAt(0).toUpperCase()
                };
                localStorage.setItem('cs2_currentUser', JSON.stringify(currentUser));
                window.location.href = 'index.html';
            } else {
                errorDiv.textContent = 'Неверный логин или пароль';
                errorDiv.style.display = 'block';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 3000);
            }
        });
    </script>
</body>
</html>
