<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - CS2 Arena</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            background: rgba(31, 41, 55, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(234, 88, 12, 0.3);
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
        }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: #ea580c;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .auth-title { color: white; font-size: 1.75rem; margin-bottom: 0.5rem; }
        .auth-subtitle { color: #9ca3af; font-size: 0.875rem; }
        .form-group { margin-bottom: 1.5rem; }
        .name-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-label {
            display: block;
            color: #d1d5db;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(55, 65, 81, 0.5);
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
        }
        .form-input:focus { outline: none; border-color: #ea580c; }
        .auth-button {
            width: 100%;
            padding: 0.75rem;
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .auth-button:hover { background: #c2410c; }
        .auth-footer { text-align: center; color: #6b7280; font-size: 0.875rem; }
        .auth-link { color: #ea580c; text-decoration: none; }
        .error-message, .success-message {
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }
        .error-message { background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #fca5a5; }
        .success-message { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #6ee7b7; }
        .back-home { text-align: center; margin-top: 1.5rem; }
        .back-home a { color: #9ca3af; text-decoration: none; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    CS2 ARENA
                </div>
                <h1 class="auth-title">Создать аккаунт</h1>
                <p class="auth-subtitle">Заполните форму для регистрации</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="registerForm">
                <div class="name-fields">
                    <div>
                        <label class="form-label">Имя</label>
                        <input type="text" id="firstName" class="form-input" placeholder="Иван" required>
                    </div>
                    <div>
                        <label class="form-label">Фамилия</label>
                        <input type="text" id="lastName" class="form-input" placeholder="Иванов" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" id="username" class="form-input" placeholder="ivan_2024" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="ivan@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="password" class="form-input" placeholder="Минимум 6 символов" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Подтвердите пароль</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Повторите пароль" required>
                </div>
                <button type="submit" class="auth-button">Зарегистрироваться</button>
                <div class="auth-footer">
                    Уже есть аккаунт? <a href="login.html" class="auth-link">Войти</a>
                </div>
            </form>
            <div class="back-home">
                <a href="index.html">← Вернуться на главную</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (!firstName || !lastName || !username || !email || !password) {
                errorDiv.textContent = 'Пожалуйста, заполните все поля';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = 'Пароль должен содержать минимум 6 символов';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Пароли не совпадают';
                errorDiv.style.display = 'block';
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorDiv.textContent = 'Введите корректный email адрес';
                errorDiv.style.display = 'block';
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('cs2_users') || '[]');
            if (users.find(u => u.username === username)) {
                errorDiv.textContent = 'Пользователь с таким именем уже существует';
                errorDiv.style.display = 'block';
                return;
            }
            if (users.find(u => u.email === email)) {
                errorDiv.textContent = 'Пользователь с таким email уже существует';
                errorDiv.style.display = 'block';
                return;
            }
            
            const newUser = {
                id: Date.now(),
                firstName: firstName,
                lastName: lastName,
                username: username,
                email: email,
                password: password,
                avatar: username.charAt(0).toUpperCase(),
                registeredAt: new Date().toISOString(),
                favorites: []
            };
            
            users.push(newUser);
            localStorage.setItem('cs2_users', JSON.stringify(users));
            
            localStorage.setItem('cs2_currentUser', JSON.stringify({
                id: newUser.id,
                username: newUser.username,
                email: newUser.email,
                firstName: newUser.firstName,
                lastName: newUser.lastName,
                avatar: newUser.avatar
            }));
            
            successDiv.textContent = 'Регистрация успешна! Перенаправление...';
            successDiv.style.display = 'block';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
