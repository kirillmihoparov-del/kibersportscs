<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - CS2 Arena</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        .admin-wrapper { display: flex; min-height: 100vh; }
        
        .admin-sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0a0a0f 0%, #11111a 100%);
            border-right: 1px solid #ea580c;
            padding: 1.5rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #2a2a3a;
        }
        .sidebar-logo svg { width: 32px; height: 32px; color: #ea580c; }
        .sidebar-logo span { color: white; font-size: 1.25rem; font-weight: 600; }
        
        .sidebar-menu { list-style: none; }
        .sidebar-item { margin-bottom: 0.5rem; }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 0.5rem;
            transition: all 0.3s;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(234, 88, 12, 0.1);
            color: #ea580c;
        }
        .sidebar-link svg { width: 20px; height: 20px; }
        .logout-btn { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #2a2a3a; }
        .logout-btn .sidebar-link { color: #dc2626; }
        .logout-btn .sidebar-link:hover { background: rgba(220, 38, 38, 0.1); color: #dc2626; }
        
        .admin-main { flex: 1; margin-left: 280px; padding: 2rem; }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #2a2a3a;
        }
        .page-title { color: white; font-size: 1.75rem; }
        .admin-user { display: flex; align-items: center; gap: 1rem; }
        .admin-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ea580c, #fb923c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }
        .admin-name { color: white; }
        .admin-role { color: #9ca3af; font-size: 0.75rem; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid #374151;
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: #ea580c; transform: translateY(-4px); }
        .stat-number { color: #ea580c; font-size: 2rem; font-weight: 700; }
        .stat-label { color: #9ca3af; font-size: 0.875rem; margin-top: 0.25rem; }
        
        .section-card {
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid #374151;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .section-title { color: white; font-size: 1.25rem; }
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #374151; color: #d1d5db; }
        th { color: #9ca3af; font-weight: 500; font-size: 0.875rem; }
        tr:hover { background: rgba(55, 65, 81, 0.3); }
        
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .status-pending { background: rgba(234, 88, 12, 0.2); color: #fb923c; }
        .status-processing { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .status-shipped { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
        .status-delivered { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-cancelled { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        .action-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-action {
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s;
        }
        .btn-confirm { background: #10b981; color: white; }
        .btn-confirm:hover { background: #059669; }
        .btn-shipped { background: #8b5cf6; color: white; }
        .btn-shipped:hover { background: #7c3aed; }
        .btn-delivered { background: #3b82f6; color: white; }
        .btn-delivered:hover { background: #2563eb; }
        .btn-cancel { background: #dc2626; color: white; }
        .btn-cancel:hover { background: #b91c1c; }
        .btn-view { background: #374151; color: white; }
        .btn-view:hover { background: #4b5563; }
        .btn-refresh { background: #ea580c; color: white; }
        .btn-refresh:hover { background: #c2410c; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1f2937;
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            border: 1px solid #ea580c;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-title { color: white; font-size: 1.25rem; }
        .modal-close {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 1.5rem;
        }
        .modal-close:hover { color: white; }
        .modal-body { color: #d1d5db; }
        .modal-body .order-info { margin-bottom: 1rem; }
        .modal-body .order-info strong { color: #ea580c; }
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .modal-actions button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        .btn-modal-close { background: #374151; color: white; }
        .btn-modal-close:hover { background: #4b5563; }
        .btn-modal-confirm { background: #10b981; color: white; }
        .btn-modal-confirm:hover { background: #059669; }
        .btn-modal-shipped { background: #8b5cf6; color: white; }
        .btn-modal-shipped:hover { background: #7c3aed; }
        .btn-modal-delivered { background: #3b82f6; color: white; }
        .btn-modal-delivered:hover { background: #2563eb; }
        .btn-modal-cancel { background: #dc2626; color: white; }
        .btn-modal-cancel:hover { background: #b91c1c; }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; padding: 1rem; }
            .mobile-menu-btn {
                display: block;
                position: fixed;
                top: 1rem;
                left: 1rem;
                z-index: 101;
                background: #ea580c;
                border: none;
                color: white;
                padding: 0.5rem;
                border-radius: 0.5rem;
                cursor: pointer;
            }
        }
        .mobile-menu-btn { display: none; }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

        <aside class="admin-sidebar" id="sidebar">
            <div class="sidebar-logo">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>CS2 ARENA Admin</span>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item"><a href="#" class="sidebar-link active" data-page="dashboard"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>Дашборд</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="orders"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>Заказы</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="tournaments"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>Турниры</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="news"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>Новости</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="products"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>Товары</a></li>
                <li class="sidebar-item"><a href="#" class="sidebar-link" data-page="users"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>Пользователи</a></li>
                <li class="sidebar-item logout-btn"><a href="#" class="sidebar-link" id="logoutLink"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>Выход</a></li>
            </ul>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1 class="page-title" id="pageTitle">Дашборд</h1>
                <div class="admin-user">
                    <div><div class="admin-name">Администратор</div><div class="admin-role">Super Admin</div></div>
                    <div class="admin-avatar">A</div>
                </div>
            </div>

            <div id="pageContent">
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><div class="stat-number" id="statOrders">0</div><div class="stat-label">Всего заказов</div></div>
                    <div class="stat-card"><div class="stat-number" id="statPending">0</div><div class="stat-label">Ожидают обработки</div></div>
                    <div class="stat-card"><div class="stat-number" id="statShipped">0</div><div class="stat-label">Отправлено</div></div>
                    <div class="stat-card"><div class="stat-number" id="statCancelled">0</div><div class="stat-label">Отменено</div></div>
                </div>

                <div class="section-card">
                    <div class="section-header">
                        <h3 class="section-title">Все заказы</h3>
                        <button class="btn-action btn-refresh" onclick="loadAllOrders()">🔄 Обновить</button>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Пользователь</th>
                                    <th>Дата</th>
                                    <th>Сумма</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="ordersList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">📋 Детали заказа #<span id="modalOrderId">—</span></h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'admin-login.html';
        }

        // ===== ГЛАВНАЯ ФУНКЦИЯ: ЗАГРУЗКА ВСЕХ ЗАКАЗОВ =====
        function loadAllOrders() {
            let allOrders = [];
            
            // 1. Получаем всех пользователей
            const users = JSON.parse(localStorage.getItem('cs2_users') || '[]');
            
            // 2. Для каждого пользователя получаем его заказы
            users.forEach(user => {
                const ordersKey = `cs2_orders_${user.id}`;
                const userOrders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
                
                // Добавляем информацию о пользователе к каждому заказу
                userOrders.forEach(order => {
                    allOrders.push({
                        ...order,
                        userName: user.username,
                        userFullName: `${user.firstName} ${user.lastName}`,
                        userId: user.id
                    });
                });
            });
            
            // 3. Сортируем по дате (сначала новые)
            allOrders.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            // 4. Сохраняем в глобальную переменную
            window.allOrders = allOrders;
            
            // 5. Обновляем статистику и таблицу
            updateStats(allOrders);
            renderOrders(allOrders);
            
            // Показываем уведомление
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #10b981;
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 0.5rem;
                z-index: 2000;
                animation: fadeIn 0.3s ease;
            `;
            toast.innerHTML = `✅ Загружено ${allOrders.length} заказов`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
            
            return allOrders;
        }

        function updateStats(orders) {
            const total = orders.length;
            const pending = orders.filter(o => o.status === 'pending' || o.status === 'processing').length;
            const shipped = orders.filter(o => o.status === 'shipped' || o.status === 'delivered').length;
            const cancelled = orders.filter(o => o.status === 'cancelled').length;

            document.getElementById('statOrders').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statShipped').textContent = shipped;
            document.getElementById('statCancelled').textContent = cancelled;
        }

        function getStatusClass(status) {
            return 'status-' + status;
        }

        function getStatusText(status) {
            const statuses = {
                'pending': 'Ожидает подтверждения',
                'processing': 'В обработке',
                'shipped': 'Отправлен',
                'delivered': 'Доставлен',
                'cancelled': 'Отменен'
            };
            return statuses[status] || status;
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('ordersList');
            if (!tbody) return;

            if (orders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align:center;padding:2rem;color:#6b7280;">
                            <div class="empty-state">
                                <div class="icon">📦</div>
                                <p>Заказов пока нет. Пользователи еще не сделали ни одного заказа.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td><strong style="color:#ea580c;">#${order.id}</strong></td>
                    <td>
                        <div style="color:white;font-weight:500;">${order.userFullName || order.userName}</div>
                        <div style="color:#9ca3af;font-size:0.75rem;">@${order.userName}</div>
                    </td>
                    <td style="color:#d1d5db;">${new Date(order.date).toLocaleDateString('ru-RU')} ${new Date(order.date).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'})}</td>
                    <td style="color:#ea580c;font-weight:700;">$${order.total.toFixed(2)}</td>
                    <td><span class="status-badge ${getStatusClass(order.status)}">${order.statusText || getStatusText(order.status)}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-action btn-view" onclick="viewOrder(${order.id})">📋</button>
                            ${order.status === 'pending' ? `<button class="btn-action btn-confirm" onclick="updateOrderStatus(${order.id}, 'processing')">✅</button>` : ''}
                            ${order.status === 'processing' ? `<button class="btn-action btn-shipped" onclick="updateOrderStatus(${order.id}, 'shipped')">📦</button>` : ''}
                            ${order.status === 'shipped' ? `<button class="btn-action btn-delivered" onclick="updateOrderStatus(${order.id}, 'delivered')">✅</button>` : ''}
                            ${(order.status === 'pending' || order.status === 'processing') ? `<button class="btn-action btn-cancel" onclick="updateOrderStatus(${order.id}, 'cancelled')">❌</button>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function getOrderById(orderId) {
            if (!window.allOrders) {
                window.allOrders = loadAllOrders();
            }
            return window.allOrders.find(o => o.id === orderId);
        }

        function viewOrder(orderId) {
            const order = getOrderById(orderId);
            if (!order) {
                alert('Заказ не найден. Обновите страницу.');
                return;
            }

            document.getElementById('modalOrderId').textContent = orderId;

            const body = document.getElementById('modalBody');
            body.innerHTML = `
                <div class="order-info">
                    <p><strong>Пользователь:</strong> ${order.userFullName || order.userName} (@${order.userName})</p>
                    <p><strong>Дата:</strong> ${new Date(order.date).toLocaleString('ru-RU')}</p>
                    <p><strong>Статус:</strong> <span class="status-badge ${getStatusClass(order.status)}">${order.statusText || getStatusText(order.status)}</span></p>
                    ${order.tradeLink ? `<p><strong>Трейд ссылка:</strong> <a href="${order.tradeLink}" target="_blank" style="color:#60a5fa;">${order.tradeLink}</a></p>` : ''}
                    ${order.cancelReason ? `<p><strong>Причина отмены:</strong> ${order.cancelReason}</p>` : ''}
                </div>
                <div style="border-top:1px solid #374151;padding-top:1rem;">
                    <h4 style="color:white;margin-bottom:0.5rem;">Товары:</h4>
                    ${order.items.map(item => `
                        <div style="display:flex;justify-content:space-between;color:#9ca3af;padding:0.25rem 0;border-bottom:1px solid rgba(55,65,81,0.3);">
                            <span>${item.name} x ${item.quantity}</span>
                            <span>$${(parseFloat(String(item.price).replace('$', '')) * item.quantity).toFixed(2)}</span>
                        </div>
                    `).join('')}
                    <div style="display:flex;justify-content:space-between;margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid #374151;">
                        <span style="color:white;font-weight:600;">Итого:</span>
                        <span style="color:#ea580c;font-weight:700;">$${order.total.toFixed(2)}</span>
                    </div>
                </div>
            `;

            const actions = document.getElementById('modalActions');
            let buttons = `<button class="btn-modal-close" onclick="closeModal()">Закрыть</button>`;

            if (order.status === 'pending') {
                buttons += `<button class="btn-modal-confirm" onclick="updateOrderStatus(${order.id}, 'processing');closeModal();">✅ Подтвердить</button>`;
                buttons += `<button class="btn-modal-cancel" onclick="updateOrderStatus(${order.id}, 'cancelled');closeModal();">❌ Отменить</button>`;
            } else if (order.status === 'processing') {
                buttons += `<button class="btn-modal-shipped" onclick="updateOrderStatus(${order.id}, 'shipped');closeModal();">📦 Отправить</button>`;
                buttons += `<button class="btn-modal-cancel" onclick="updateOrderStatus(${order.id}, 'cancelled');closeModal();">❌ Отменить</button>`;
            } else if (order.status === 'shipped') {
                buttons += `<button class="btn-modal-delivered" onclick="updateOrderStatus(${order.id}, 'delivered');closeModal();">✅ Доставлен</button>`;
            }

            actions.innerHTML = buttons;

            document.getElementById('orderModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateOrderStatus(orderId, newStatus) {
            const order = getOrderById(orderId);
            if (!order) {
                alert('Заказ не найден. Обновите страницу.');
                return;
            }

            const statusTexts = {
                'processing': 'В обработке',
                'shipped': 'Отправлен',
                'delivered': 'Доставлен',
                'cancelled': 'Отменен'
            };

            if (newStatus === 'cancelled' && order.status !== 'cancelled') {
                const reason = prompt('Укажите причину отмены заказа:');
                if (reason === null) return;
                order.cancelReason = reason || 'Отменен администратором';
            }

            // Обновляем заказ в localStorage пользователя
            const users = JSON.parse(localStorage.getItem('cs2_users') || '[]');
            const user = users.find(u => u.id === order.userId);
            
            if (user) {
                const ordersKey = `cs2_orders_${user.id}`;
                const userOrders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
                const orderIndex = userOrders.findIndex(o => o.id === orderId);
                
                if (orderIndex !== -1) {
                    userOrders[orderIndex].status = newStatus;
                    userOrders[orderIndex].statusText = statusTexts[newStatus];
                    if (newStatus === 'cancelled') {
                        userOrders[orderIndex].cancelReason = order.cancelReason;
                    }
                    localStorage.setItem(ordersKey, JSON.stringify(userOrders));
                }
            }

            // Обновляем в глобальном массиве
            if (window.allOrders) {
                const index = window.allOrders.findIndex(o => o.id === orderId);
                if (index !== -1) {
                    window.allOrders[index].status = newStatus;
                    window.allOrders[index].statusText = statusTexts[newStatus];
                    if (newStatus === 'cancelled') {
                        window.allOrders[index].cancelReason = order.cancelReason;
                    }
                }
            }

            // Обновляем отображение
            updateStats(window.allOrders || []);
            renderOrders(window.allOrders || []);

            const messages = {
                'processing': '✅ Заказ подтвержден!',
                'shipped': '📦 Заказ отправлен!',
                'delivered': '✅ Заказ доставлен!',
                'cancelled': '❌ Заказ отменен!'
            };

            alert(messages[newStatus] || 'Статус обновлен!');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('orderModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Навигация
        document.querySelectorAll('.sidebar-link[data-page]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                const page = link.dataset.page;
                
                if (page === 'dashboard' || page === 'orders') {
                    document.getElementById('pageTitle').textContent = page === 'dashboard' ? 'Дашборд' : 'Управление заказами';
                    const content = document.getElementById('pageContent');
                    content.innerHTML = `
                        <div class="stats-grid" id="statsGrid">
                            <div class="stat-card"><div class="stat-number" id="statOrders">0</div><div class="stat-label">Всего заказов</div></div>
                            <div class="stat-card"><div class="stat-number" id="statPending">0</div><div class="stat-label">Ожидают обработки</div></div>
                            <div class="stat-card"><div class="stat-number" id="statShipped">0</div><div class="stat-label">Отправлено</div></div>
                            <div class="stat-card"><div class="stat-number" id="statCancelled">0</div><div class="stat-label">Отменено</div></div>
                        </div>
                        <div class="section-card">
                            <div class="section-header">
                                <h3 class="section-title">Все заказы</h3>
                                <button class="btn-action btn-refresh" onclick="loadAllOrders()">🔄 Обновить</button>
                            </div>
                            <div class="table-wrapper">
                                <table><thead><tr><th>ID</th><th>Пользователь</th><th>Дата</th><th>Сумма</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="ordersList"></tbody></table>
                            </div>
                        </div>
                    `;
                    const orders = loadAllOrders();
                    updateStats(orders);
                    renderOrders(orders);
                } else {
                    document.getElementById('pageTitle').textContent = 
                        page === 'tournaments' ? 'Управление турнирами' :
                        page === 'news' ? 'Управление новостями' :
                        page === 'products' ? 'Управление товарами' :
                        'Управление пользователями';
                    document.getElementById('pageContent').innerHTML = `
                        <div class="section-card">
                            <div class="section-header"><h3 class="section-title">${document.getElementById('pageTitle').textContent}</h3><button class="btn-add">+ Добавить</button></div>
                            <div class="empty-state"><div class="icon">🚧</div><p>Раздел в разработке</p></div>
                        </div>
                    `;
                }
            });
        });

        document.getElementById('logoutLink').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem('adminLoggedIn');
                window.location.href = 'admin-login.html';
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Добавляем стили для анимации
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // Инициализация - загружаем все заказы
        const initialOrders = loadAllOrders();
        updateStats(initialOrders);
        renderOrders(initialOrders);
    </script>
</body>
</html>
