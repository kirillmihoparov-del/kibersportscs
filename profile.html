<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - CS2 Arena</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container { min-height: 100vh; background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%); padding: 2rem; }
        .profile-card { max-width: 1200px; margin: 0 auto; }
        .profile-header { background: rgba(31, 41, 55, 0.5); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; border: 1px solid rgba(234, 88, 12, 0.3); display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; }
        .profile-avatar { width: 100px; height: 100px; background: linear-gradient(135deg, #ea580c, #fb923c); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 700; color: white; }
        .profile-info { flex: 1; }
        .profile-name { color: white; font-size: 2rem; margin-bottom: 0.5rem; }
        .profile-username { color: #9ca3af; font-size: 1rem; margin-bottom: 0.5rem; }
        .profile-email { color: #9ca3af; font-size: 0.875rem; }
        .profile-stats { display: flex; gap: 2rem; margin-top: 1rem; flex-wrap: wrap; }
        .stat-badge { background: rgba(55, 65, 81, 0.5); padding: 0.5rem 1rem; border-radius: 0.5rem; text-align: center; }
        .stat-badge-value { color: #ea580c; font-size: 1.5rem; font-weight: 700; }
        .stat-badge-label { color: #9ca3af; font-size: 0.75rem; }
        .logout-btn { background: rgba(220, 38, 38, 0.2); color: #fca5a5; border: 1px solid #dc2626; padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; }
        .logout-btn:hover { background: #dc2626; color: white; }
        .profile-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid #374151; flex-wrap: wrap; }
        .tab-btn { background: none; color: #9ca3af; padding: 0.75rem 1.5rem; border: none; cursor: pointer; transition: all 0.3s; font-size: 1rem; }
        .tab-btn:hover, .tab-btn.active { color: #ea580c; border-bottom: 2px solid #ea580c; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .info-grid { background: rgba(31, 41, 55, 0.5); border-radius: 1rem; padding: 1.5rem; border: 1px solid #374151; }
        .info-row { display: flex; padding: 1rem 0; border-bottom: 1px solid #374151; }
        .info-row:last-child { border-bottom: none; }
        .info-label { width: 150px; color: #9ca3af; font-weight: 500; }
        .info-value { color: white; flex: 1; }
        .edit-btn { background: #ea580c; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer; }
        .edit-btn:hover { background: #c2410c; }
        .order-card { background: rgba(55, 65, 81, 0.3); border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem; border: 1px solid #374151; }
        .status-pending { background: rgba(234, 88, 12, 0.2); color: #fb923c; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #1f2937; border-radius: 1rem; padding: 2rem; width: 90%; max-width: 400px; border: 1px solid #ea580c; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-title { color: white; font-size: 1.25rem; }
        .modal-close { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1.5rem; }
        .modal-form-group { margin-bottom: 1rem; }
        .modal-form-group label { display: block; color: #d1d5db; margin-bottom: 0.5rem; }
        .modal-form-group input { width: 100%; padding: 0.5rem; background: #374151; border: 1px solid #4b5563; border-radius: 0.375rem; color: white; }
        .modal-save { width: 100%; padding: 0.75rem; background: #ea580c; color: white; border: none; border-radius: 0.5rem; cursor: pointer; margin-top: 1rem; }
        @media (max-width: 768px) { .profile-header { flex-direction: column; text-align: center; } .info-row { flex-direction: column; } .info-label { width: 100%; margin-bottom: 0.5rem; } }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="userAvatar">U</div>
                <div class="profile-info">
                    <h1 class="profile-name" id="userFullName">Загрузка...</h1>
                    <div class="profile-username" id="userUsername">@username</div>
                    <div class="profile-email" id="userEmail">email@example.com</div>
                    <div class="profile-stats">
                        <div class="stat-badge"><div class="stat-badge-value" id="userOrdersCount">0</div><div class="stat-badge-label">Заказов</div></div>
                        <div class="stat-badge"><div class="stat-badge-value" id="userSince">-</div><div class="stat-badge-label">На сайте</div></div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>

            <div class="profile-tabs">
                <button class="tab-btn active" data-tab="info">Личная информация</button>
                <button class="tab-btn" data-tab="orders">Мои заказы</button>
                <button class="tab-btn" data-tab="catalog">Магазин</button>
            </div>

            <div class="tab-content active" id="tab-info">
                <div class="info-grid">
                    <div class="info-row"><div class="info-label">Имя</div><div class="info-value" id="displayFirstName">-</div></div>
                    <div class="info-row"><div class="info-label">Фамилия</div><div class="info-value" id="displayLastName">-</div></div>
                    <div class="info-row"><div class="info-label">Имя пользователя</div><div class="info-value" id="displayUsername">-</div></div>
                    <div class="info-row"><div class="info-label">Email</div><div class="info-value" id="displayEmail">-</div></div>
                    <div class="info-row"><div class="info-label"></div><div class="info-value"><button class="edit-btn" onclick="openEditModal()">Редактировать профиль</button></div></div>
                </div>
            </div>

            <div class="tab-content" id="tab-orders">
                <div class="info-grid"><h3 style="color: white; margin-bottom: 1rem;">📦 История заказов</h3><div id="ordersList"></div></div>
            </div>

            <div class="tab-content" id="tab-catalog">
                <div class="info-grid"><h3 style="color: white; margin-bottom: 1rem;">🛍️ Перейти в магазин</h3><div style="text-align: center; padding: 2rem;"><p style="color: #9ca3af; margin-bottom: 1.5rem;">Выберите товары и добавьте их в корзину</p><a href="catalog.html" class="btn-primary" style="display: inline-block;">Перейти в магазин</a></div></div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 class="modal-title">Редактировать профиль</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
            <form id="editForm">
                <div class="modal-form-group"><label>Имя</label><input type="text" id="editFirstName" required></div>
                <div class="modal-form-group"><label>Фамилия</label><input type="text" id="editLastName" required></div>
                <div class="modal-form-group"><label>Email</label><input type="email" id="editEmail" required></div>
                <button type="submit" class="modal-save">Сохранить изменения</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null, allUsers = [];
        function loadUserData() {
            const savedUser = localStorage.getItem('cs2_currentUser');
            if (!savedUser) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(savedUser);
            allUsers = JSON.parse(localStorage.getItem('cs2_users') || '[]');
            const fullUser = allUsers.find(u => u.id === currentUser.id);
            if (!fullUser) { localStorage.removeItem('cs2_currentUser'); window.location.href = 'login.html'; return; }
            document.getElementById('userAvatar').textContent = currentUser.avatar || currentUser.username.charAt(0).toUpperCase();
            document.getElementById('userFullName').textContent = `${fullUser.firstName} ${fullUser.lastName}`;
            document.getElementById('userUsername').textContent = `@${currentUser.username}`;
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('displayFirstName').textContent = fullUser.firstName;
            document.getElementById('displayLastName').textContent = fullUser.lastName;
            document.getElementById('displayUsername').textContent = currentUser.username;
            document.getElementById('displayEmail').textContent = currentUser.email;
            const registeredDate = new Date(fullUser.registeredAt);
            document.getElementById('userSince').textContent = registeredDate.toLocaleDateString('ru-RU');
            const ordersKey = `cs2_orders_${currentUser.id}`;
            const orders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
            document.getElementById('userOrdersCount').textContent = orders.length;
            renderOrders(orders);
        }
        function renderOrders(orders) {
            const container = document.getElementById('ordersList');
            if (!container) return;
            if (orders.length === 0) { container.innerHTML = '<div style="text-align: center; padding: 2rem; color: #6b7280;">У вас пока нет заказов. Перейдите в магазин, чтобы сделать первый заказ!</div>'; return; }
            container.innerHTML = orders.map(order => `<div class="order-card"><div style="display: flex; justify-content: space-between; flex-wrap: wrap; margin-bottom: 0.5rem;"><div><span style="color: #ea580c; font-weight: 600;">Заказ #${order.id}</span><span style="color: #9ca3af; margin-left: 1rem;">${new Date(order.date).toLocaleDateString('ru-RU')}</span></div><div><span class="status-pending">${order.statusText}</span></div></div><div style="margin-bottom: 0.5rem;">${order.items.map(item => `<div style="display: flex; justify-content: space-between; color: #d1d5db; font-size: 0.875rem; margin-bottom: 0.25rem;"><span>${item.name} x ${item.quantity}</span><span>$${(parseFloat(item.price.replace('$', '')) * item.quantity).toFixed(2)}</span></div>`).join('')}</div><div style="display: flex; justify-content: space-between; border-top: 1px solid #374151; padding-top: 0.5rem;"><span style="color: white; font-weight: 600;">Итого:</span><span style="color: #ea580c; font-weight: 700;">$${order.total.toFixed(2)}</span></div></div>`).join('');
        }
        function openEditModal() {
            const fullUser = allUsers.find(u => u.id === currentUser.id);
            if (fullUser) {
                document.getElementById('editFirstName').value = fullUser.firstName;
                document.getElementById('editLastName').value = fullUser.lastName;
                document.getElementById('editEmail').value = fullUser.email;
                document.getElementById('editModal').style.display = 'flex';
            }
        }
        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newFirstName = document.getElementById('editFirstName').value.trim();
            const newLastName = document.getElementById('editLastName').value.trim();
            const newEmail = document.getElementById('editEmail').value.trim();
            const userIndex = allUsers.findIndex(u => u.id === currentUser.id);
            if (userIndex !== -1) {
                allUsers[userIndex].firstName = newFirstName;
                allUsers[userIndex].lastName = newLastName;
                allUsers[userIndex].email = newEmail;
                localStorage.setItem('cs2_users', JSON.stringify(allUsers));
                currentUser.firstName = newFirstName;
                currentUser.lastName = newLastName;
                currentUser.email = newEmail;
                localStorage.setItem('cs2_currentUser', JSON.stringify(currentUser));
                closeModal();
                loadUserData();
                alert('Профиль успешно обновлен!');
            }
        });
        function logout() { localStorage.removeItem('cs2_currentUser'); localStorage.removeItem('cs2_rememberMe'); window.location.href = 'index.html'; }
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(`tab-${this.dataset.tab}`).classList.add('active');
            });
        });
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'orders') {
            document.querySelector('.tab-btn[data-tab="orders"]').click();
        }
        window.onclick = function(event) { const modal = document.getElementById('editModal'); if (event.target === modal) closeModal(); }
        loadUserData();
    </script>
</body>
</html>
