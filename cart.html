<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - CS2 Arena</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cart-container { min-height: 100vh; background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%); padding: 2rem; }
        .cart-wrapper { max-width: 1200px; margin: 0 auto; }
        .cart-header { margin-bottom: 2rem; }
        .cart-header h1 { color: white; font-size: 2rem; }
        .cart-header p { color: #9ca3af; }
        .cart-grid { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }
        .cart-items { background: rgba(31, 41, 55, 0.5); border-radius: 1rem; border: 1px solid #374151; overflow: hidden; }
        .cart-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; border-bottom: 1px solid #374151; }
        .cart-item-image { width: 80px; height: 80px; background: #1f2937; border-radius: 0.5rem; overflow: hidden; }
        .cart-item-image img { width: 100%; height: 100%; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .cart-item-title { color: white; font-weight: 600; }
        .cart-item-quality { color: #9ca3af; font-size: 0.875rem; }
        .cart-item-price { color: #ea580c; font-weight: 700; }
        .cart-item-actions { display: flex; align-items: center; gap: 0.5rem; }
        .quantity-btn { background: #374151; border: none; color: white; width: 30px; height: 30px; border-radius: 0.375rem; cursor: pointer; }
        .quantity-btn:hover { background: #ea580c; }
        .quantity-input { width: 50px; text-align: center; background: #1f2937; border: 1px solid #4b5563; color: white; padding: 0.25rem; border-radius: 0.375rem; }
        .remove-item { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 1.25rem; padding: 0.5rem; }
        .cart-summary { background: rgba(31, 41, 55, 0.5); border-radius: 1rem; border: 1px solid #374151; padding: 1.5rem; position: sticky; top: 100px; }
        .summary-title { color: white; font-size: 1.25rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #374151; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: #d1d5db; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #374151; color: white; font-size: 1.25rem; font-weight: 700; }
        .total-price { color: #ea580c; }
        .checkout-btn { width: 100%; background: #ea580c; color: white; padding: 0.75rem; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .checkout-btn:hover { background: #c2410c; }
        .empty-cart { text-align: center; padding: 3rem; background: rgba(31, 41, 55, 0.5); border-radius: 1rem; }
        .empty-cart svg { width: 80px; height: 80px; color: #4b5563; margin-bottom: 1rem; }
        .user-menu { display: flex; align-items: center; gap: 0.5rem; }
        .btn-profile { background: rgba(234, 88, 12, 0.2); color: #ea580c; padding: 0.5rem 1rem; border-radius: 0.375rem; text-decoration: none; }
        .btn-logout { background: rgba(220, 38, 38, 0.2); color: #fca5a5; padding: 0.5rem 1rem; border-radius: 0.375rem; border: none; cursor: pointer; }
        @media (max-width: 768px) { .cart-grid { grid-template-columns: 1fr; } .cart-item { flex-direction: column; text-align: center; } .cart-item-actions { justify-content: center; } }
        @media (max-width: 1024px) { nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #000000; flex-direction: column; padding: 1rem; gap: 1rem; border-top: 1px solid #ea580c; z-index: 100; } nav.show { display: flex; } .mobile-menu-button { display: block; } }
        @media (min-width: 1025px) { .mobile-menu-button { display: none; } }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo"><svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>CS2 ARENA</span></a>
                <nav>
                    <button onclick="window.location.href='index.html'">Главная</button>
                    <button onclick="window.location.href='catalog.html'">Магазин</button>
                    <button onclick="window.location.href='index.html#tournaments'">Турниры</button>
                    <button onclick="window.location.href='index.html#news'">Новости</button>
                    <button onclick="window.location.href='teams.html'">Команды</button>
                    <button onclick="window.location.href='matches.html'">Матчи</button>
                    <button onclick="window.location.href='teams-ranking.html'">Рейтинг</button>
                </nav>
                <div class="auth-buttons" id="authButtons"><a href="login.html" class="btn-login">Вход</a><a href="register.html" class="btn-register">Регистрация</a></div>
                <div class="user-menu" id="userMenu" style="display: none;">
                    <a href="profile.html" class="btn-profile"><span id="userNameDisplay"></span></a>
                    <button class="btn-logout" onclick="logout()">Выйти</button>
                </div>
                <button class="mobile-menu-button" onclick="toggleMobileMenu()"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
            </div>
        </div>
    </header>

    <div class="cart-container"><div class="cart-wrapper"><div class="cart-header"><h1>🛒 Корзина</h1><p>Ваши выбранные товары</p></div><div id="cartContent"></div></div></div>

    <footer><div class="container"><div class="footer-grid"><div class="footer-section"><div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;"><svg style="width: 1.5rem; height: 1.5rem; color: #ea580c;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span style="color: white;">CS2 ARENA</span></div><p class="footer-description">Ваш главный источник информации о турнирах и новостях Counter-Strike 2</p></div><div class="footer-section"><h4>Разделы</h4><ul class="footer-links"><li><a href="index.html">Главная</a></li><li><a href="catalog.html">Магазин</a></li><li><a href="teams.html">Команды</a></li><li><a href="matches.html">Матчи</a></li></ul></div><div class="footer-section"><h4>Аккаунт</h4><ul class="footer-links"><li><a href="login.html">Вход</a></li><li><a href="register.html">Регистрация</a></li><li><a href="profile.html">Личный кабинет</a></li></ul></div></div><div class="footer-bottom"><p>&copy; 2025 CS2 Arena. Все права защищены.</p></div></div></footer>

    <script>
        function checkAuth() {
            const currentUser = localStorage.getItem('cs2_currentUser');
            const authButtons = document.getElementById('authButtons');
            const userMenu = document.getElementById('userMenu');
            const userNameDisplay = document.getElementById('userNameDisplay');
            if (currentUser) {
                const user = JSON.parse(currentUser);
                if (authButtons) authButtons.style.display = 'none';
                if (userMenu) userMenu.style.display = 'flex';
                if (userNameDisplay) userNameDisplay.textContent = user.username;
            } else {
                if (authButtons) authButtons.style.display = 'flex';
                if (userMenu) userMenu.style.display = 'none';
                window.location.href = 'login.html';
            }
        }
        function logout() { localStorage.removeItem('cs2_currentUser'); localStorage.removeItem('cs2_rememberMe'); window.location.href = 'index.html'; }
        function toggleMobileMenu() { const nav = document.querySelector('nav'); if (nav) nav.classList.toggle('show'); }
        function getCart() { const currentUser = localStorage.getItem('cs2_currentUser'); if (!currentUser) return []; const user = JSON.parse(currentUser); return JSON.parse(localStorage.getItem(`cs2_cart_${user.id}`) || '[]'); }
        function saveCart(cart) { const currentUser = localStorage.getItem('cs2_currentUser'); if (!currentUser) return; const user = JSON.parse(currentUser); localStorage.setItem(`cs2_cart_${user.id}`, JSON.stringify(cart)); }
        function updateQuantity(itemId, newQuantity) { let cart = getCart(); const itemIndex = cart.findIndex(i => i.id === itemId); if (itemIndex !== -1) { if (newQuantity <= 0) cart.splice(itemIndex, 1); else cart[itemIndex].quantity = newQuantity; saveCart(cart); renderCart(); } }
        function removeItem(itemId) { let cart = getCart(); cart = cart.filter(i => i.id !== itemId); saveCart(cart); renderCart(); }
        function getTotalPrice() { const cart = getCart(); return cart.reduce((total, item) => total + (parseFloat(item.price.replace('$', '')) * item.quantity), 0); }
        function checkout() {
            const currentUser = localStorage.getItem('cs2_currentUser'); if (!currentUser) { alert('Войдите в аккаунт'); window.location.href = 'login.html'; return; }
            const cart = getCart(); if (cart.length === 0) { alert('Корзина пуста'); return; }
            const user = JSON.parse(currentUser); const total = getTotalPrice();
            const order = { id: Date.now(), userId: user.id, userName: user.username, date: new Date().toISOString(), items: [...cart], total: total, status: 'pending', statusText: 'Ожидает подтверждения' };
            const ordersKey = `cs2_orders_${user.id}`;
            const existingOrders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
            existingOrders.unshift(order);
            localStorage.setItem(ordersKey, JSON.stringify(existingOrders));
            localStorage.setItem(`cs2_cart_${user.id}`, JSON.stringify([]));
            alert(`✅ Заказ оформлен!\nНомер: ${order.id}\nСумма: $${total.toFixed(2)}`);
            renderCart();
            window.location.href = 'profile.html?tab=orders';
        }
        function renderCart() {
            const cart = getCart(); const container = document.getElementById('cartContent');
            if (!container) return;
            if (cart.length === 0) { container.innerHTML = `<div class="empty-cart"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg><h3>Корзина пуста</h3><p>Добавьте товары в корзину</p><a href="catalog.html" class="btn-primary">Перейти в магазин</a></div>`; return; }
            const total = getTotalPrice();
            container.innerHTML = `<div class="cart-grid"><div class="cart-items">${cart.map(item => `<div class="cart-item"><div class="cart-item-image"><img src="${item.image}" alt="${item.name}"></div><div class="cart-item-info"><div class="cart-item-title">${item.name}</div><div class="cart-item-quality">${item.quality}</div><div class="cart-item-price">${item.price}</div></div><div class="cart-item-actions"><button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button><input type="text" class="quantity-input" value="${item.quantity}" readonly><button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button><button class="remove-item" onclick="removeItem(${item.id})">🗑️</button></div></div>`).join('')}</div><div class="cart-summary"><div class="summary-title">Итого</div><div class="summary-row"><span>Товары (${cart.reduce((sum, i) => sum + i.quantity, 0)} шт.)</span><span>$${total.toFixed(2)}</span></div><div class="summary-row"><span>Доставка</span><span>Бесплатно</span></div><div class="summary-total"><span>К оплате</span><span class="total-price">$${total.toFixed(2)}</span></div><button class="checkout-btn" onclick="checkout()">Оформить заказ</button></div></div>`;
        }
        checkAuth(); renderCart();
    </script>
</body>
</html>
