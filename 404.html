<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - CS2 Arena</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .error-content {
            max-width: 600px;
            padding: 3rem;
        }
        .error-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            color: #ea580c;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ea580c 0%, #fb923c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            line-height: 1;
        }
        .error-title {
            font-size: 2rem;
            color: white;
            margin-bottom: 1rem;
        }
        .error-description {
            color: #9ca3af;
            font-size: 1.125rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }
        .error-search {
            max-width: 400px;
            margin: 0 auto 2rem;
        }
        .search-form {
            display: flex;
            gap: 0.5rem;
        }
        .search-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: rgba(55, 65, 81, 0.5);
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
        }
        .search-input:focus {
            outline: none;
            border-color: #ea580c;
        }
        .search-button {
            padding: 0.75rem 1.5rem;
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .search-button:hover {
            background: #c2410c;
        }
        .error-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }
        .error-link {
            color: #9ca3af;
            text-decoration: none;
            padding: 0.5rem;
            border-radius: 0.375rem;
            transition: all 0.3s;
            font-size: 0.875rem;
        }
        .error-link:hover {
            color: #ea580c;
            background: rgba(234, 88, 12, 0.1);
        }
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
        }
        .cs2-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            color: #ea580c;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-logo">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                CS2 ARENA
            </div>

            <svg class="cs2-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>

            <div class="error-code">404</div>
            <h1 class="error-title">Страница не найдена</h1>
            <p class="error-description">
                К сожалению, запрашиваемая страница не существует. Возможно, она была перемещена или удалена.
            </p>

            <div class="error-actions">
                <a href="index.html" class="btn-primary">На главную</a>
                <a href="javascript:history.back()" class="btn-secondary">Назад</a>
            </div>

            <div class="error-search">
                <form class="search-form">
                    <input type="text" class="search-input" placeholder="Поиск по сайту...">
                    <button type="submit" class="search-button">Найти</button>
                </form>
            </div>

            <div class="error-links">
                <a href="catalog.html" class="error-link">Магазин</a>
                <a href="teams.html" class="error-link">Команды</a>
                <a href="matches.html" class="error-link">Матчи</a>
                <a href="teams-ranking.html" class="error-link">Рейтинг</a>
                <a href="login.html" class="error-link">Вход</a>
            </div>
        </div>
    </div>

    <script>
        function navigateTo(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
